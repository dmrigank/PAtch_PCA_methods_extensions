dataset:
  name: darcy
  processed_path: data/processed/darcy_128.npz
  input_keys:
    - a
  output_key: u
  grid_size: 128
  constant_forcing: 1.0

loss:
  pde: darcy

evaluation:
  metrics:
    - mse
    - mae
    - mre
    - ssim
    - relative_spectrum_error
    - interface_jump
    - interface_flux_jump
    - darcy_residual
