experiment:
  name: l2l_plain_seed0
  seed: 0
  output_dir: results/l2l_plain_seed0

mechanisms:
  two_scale: false
  coupling: false
  in_loop_loss: false

pca:
  type: local_to_local
  input_variance: 0.99
  output_variance: 0.99
  solver: full
  standardize: true
  randomized:
    oversampling: 20
    n_iter: 4

patches:
  patch_size: 32
  stride: 32
  assembly: average

model:
  type: mlp
  hidden_size: 128
  num_layers: 4
  activation: relu
  dropout: 0.0

training:
  batch_size: 32
  eval_batch_size: 256
  epochs: 500
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: reduce_on_plateau
  patience: 30
  device: auto

evaluation:
  metrics:
    - mse
    - mae
    - mre
    - ssim
    - relative_spectrum_error
    - interface_jump
    - poisson_residual
  save_predictions: true
