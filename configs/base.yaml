experiment:
  name: l2l_plain_seed0
  seed: 0
  output_dir: results/l2l_plain_seed0

mechanisms:
  two_scale: false
  coupling: false
  in_loop_loss: false

pca:
  type: local_to_local
  input_variance: 0.99
  output_variance: 0.99
  solver: full
  standardize: true
  two_scale:
    coarse_factor: 4
    coarse_components: 20
    coarse_variance: 0.99
  randomized:
    oversampling: 20
    n_iter: 4

patches:
  patch_size: 32
  stride: 32
  assembly: average

model:
  type: mlp
  hidden_size: 128
  num_layers: 4
  activation: relu
  dropout: 0.0
  coupling:
    backend: gnn
    embed_dim: 128
    num_layers: 3
    neighborhood: 8
    attention_heads: 4
    attention_n_max: 256
    local_residual: false
    local_hidden_size: 64
    local_num_layers: 2
    zero_init_correction: false

training:
  batch_size: 32
  eval_batch_size: 256
  epochs: 500
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: reduce_on_plateau
  patience: 30
  device: auto

loss:
  reconstruction: relative_l2
  interface_target: zero
  active_terms:
    - recon
    - interface_value
    - interface_flux
    - pde_residual
    - spectral
  weights:
    recon: 1.0
    interface_value: 0.05
    interface_flux: 1.0e-3
    pde_residual: 1.0e-6
    spectral: 0.05
  warmup:
    reconstruction_epochs: 10
    ramp_epochs: 40
  pde: poisson
  pde_reduction: rms
  spectral_high_k_weight_power: 1.0

evaluation:
  metrics:
    - mse
    - mae
    - mre
    - ssim
    - relative_spectrum_error
    - interface_jump
    - interface_flux_jump
    - poisson_residual
  save_predictions: true
