[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpcanet"
version = "0.1.0"
description = "Localized PCA-Net with interface consistency by construction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
mgtfno = [
    "neuraloperator",
    "tensorly",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
